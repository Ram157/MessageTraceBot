name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare public Wrangler configuration
        run: cp wrangler.example.jsonc wrangler.jsonc

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check

      - name: Build Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/ci --secrets-file .dev.vars.example
